[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codeopt"
version = "0.1.0"
description = "Verification-first Python performance optimization engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "CodeOpt Contributors" }]
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
analysis = [
    "coverage[toml]>=7.6,<8",
    "hypothesis>=6.120,<7",
]
benchmark = ["pyperf>=2.7,<3"]
llm = ["openai>=1.0,<3"]
mcp = ["mcp>=1.0,<2"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
codeopt = "codeopt.adapters.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codeopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
